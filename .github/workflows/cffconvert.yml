name: cffconvert

on:
  push:
    paths:
      - CITATION.cff

permissions:
  contents: write
  pull-requests: write

jobs:
  normalize-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # date-released is set on the release PR by the release-please workflow.
      - name: Normalize CITATION.cff
        run: |
          set -e
          echo "Normalizing CITATION.cff quoting"

          sed -E -i 's/^( *repository-code:\s*)"?([^\"]+)"?/\1"\2"/' CITATION.cff || true
          sed -E -i 's/^( *orcid:\s*)"?([^\"]+)"?/\1"\2"/' CITATION.cff || true

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Create normalization PR if needed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: normalize CITATION.cff formatting (quotes)"
          branch: "normalize-citation/${{ github.run_id }}"
          title: "chore: Normalize CITATION.cff formatting"
          body: |
            Automated normalization of `CITATION.cff` to preserve quoted URL scalars.
          labels: automation
          base: main
          draft: false
